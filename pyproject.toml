[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soulking"
version = "2.0.0"
description = "SoulKing — A Haunted, AI-Powered Linux Terminal Assistant inspired by the Soul King."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SoulKing Contributors"}
]
keywords = ["soulking", "cli", "terminal", "linux", "kali", "ollama", "ai", "cybersecurity", "rich"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.23.0",
    "Pygments>=2.15.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
soulking = "soulshell.app:main"
soulshell = "soulshell.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
